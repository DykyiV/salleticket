name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure environment
        # Production mode refuses the example secrets, so CI generates its own.
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\"$(openssl rand -base64 48)\"|" .env
          sed -i "s|^CRON_SECRET=.*|CRON_SECRET=\"$(openssl rand -base64 48)\"|" .env
          # Smoke tests book on the demo carriers.
          sed -i "s|^ENABLE_DEMO_CARRIERS=.*|ENABLE_DEMO_CARRIERS=\"1\"|" .env

      - name: Apply database schema
        run: npm run db:push

      - name: Seed test data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start -- -p 3100 &

      - name: Smoke tests
        run: npm run test:smoke
