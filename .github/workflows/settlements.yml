name: Monthly carrier settlements

# Runs at 06:17 UTC on the 7th of every month: generates settlements
# (invoice + act) for the previous month for every carrier and marks them
# sent. Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "17 6 7 * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger settlement generation
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL repository variable and CRON_SECRET repository secret first."
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$APP_URL/api/cron/settlements" \
            -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n 1)
          code=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "Settlement generation failed with HTTP $code"
            exit 1
          fi
